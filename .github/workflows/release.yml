on:
  push:
    branches:
      - main
    tags:
      - v*

name: Build and create release
permissions:
    actions: write
    checks: write
    contents: write
    deployments: write
    id-token: write
    issues: write
    discussions: write
    packages: write
    pages: write
    pull-requests: write
    repository-projects: write
    security-events: write
    statuses: write

jobs:
  build:
    name: Build and upload release binary
    if: ${{ startsWith(github.ref, 'refs/tags/v')}}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
      - name: Set up JDK 11
        uses: actions/setup-java@e9fbacdec3bb3b6036605a3e6f7995d66773a8c6 # v3.14.2
        with:
          distribution: 'zulu'
          java-version: 11
      - name: Get java-version
        id: get-version
        run: |
          BUILD_VERSION=$( mvn help:evaluate -Dexpression=project.version -q -DforceStdout )
          echo "::set-output name=VERSION::$BUILD_VERSION"
      - name: Build with Maven
        run: mvn -B package --file pom.xml
      - name: Run Unit Tests
        run: mvn clean test
      - name: Run Integration Test
        shell: pwsh
        run: ./src/docker/startup.ps1
      - name: Create Release
        id: create_release
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
      - name: Upload Release Asset 1
        id: upload-release-asset-1
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./target/kafka-connect-cosmos-${{steps.get-version.outputs.VERSION}}-jar-with-dependencies.jar
          asset_name: kafka-connect-cosmos-${{steps.get-version.outputs.VERSION}}-jar-with-dependencies.jar
          asset_content_type: application/java-archive
      - name: Upload Release Asset 2
        id: upload-release-asset-2
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./target/components/packages/microsoftcorporation-kafka-connect-cosmos-${{steps.get-version.outputs.VERSION}}.zip
          asset_name: microsoftcorporation-kafka-connect-cosmos-${{steps.get-version.outputs.VERSION}}.zip
          asset_content_type: application/zip
